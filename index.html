<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>German Grammar — Full Curriculum A1 to C1</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f5f5f3;--bg3:#ebebea;
  --text:#1a1a1a;--text2:#555552;--text3:#99988f;
  --border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.2);
  --info-bg:#e6f1fb;--info-text:#0c447c;--info-border:rgba(24,95,165,0.35);
  --success-bg:#eaf3de;--success-text:#3b6d11;--success-border:rgba(59,109,17,0.3);
  --danger-bg:#fcebeb;--danger-text:#a32d2d;--danger-border:rgba(163,45,45,0.3);
  --warn-bg:#faeeda;--warn-text:#854f0b;--warn-border:rgba(133,79,11,0.3);
  --r:8px;--rl:12px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1c1c1a;--bg2:#252523;--bg3:#2d2d2b;
    --text:#f0efea;--text2:#aaa89f;--text3:#6b6a65;
    --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.18);
    --info-bg:#0c2a44;--info-text:#85b7eb;--info-border:rgba(55,138,221,0.35);
    --success-bg:#172c0a;--success-text:#97c459;--success-border:rgba(99,153,34,0.3);
    --danger-bg:#2d1010;--danger-text:#f09595;--danger-border:rgba(226,75,74,0.3);
    --warn-bg:#2a1e08;--warn-text:#ef9f27;--warn-border:rgba(186,117,23,0.3);
  }
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg3);color:var(--text);min-height:100vh;font-size:15px;line-height:1.6}
/* Layout */
.shell{display:flex;min-height:100vh}
.sidebar{width:220px;min-width:220px;background:var(--bg2);border-right:0.5px solid var(--border);padding:16px 0;overflow-y:auto;position:sticky;top:0;height:100vh}
.main{flex:1;padding:24px 28px 60px;overflow-y:auto;max-width:820px}
.sidebar-title{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;padding:0 16px;margin-bottom:8px;margin-top:12px}
.sidebar-title:first-child{margin-top:0}
.level-group{margin-bottom:4px}
.level-btn{width:100%;text-align:left;font-size:13px;padding:7px 16px;border:none;background:transparent;color:var(--text2);cursor:pointer;border-left:3px solid transparent;font-family:inherit;transition:all 0.12s}
.level-btn:hover{background:var(--bg3);color:var(--text)}
.level-btn.active{background:var(--info-bg);color:var(--info-text);border-left-color:var(--info-text);font-weight:500}
.level-btn.done{color:var(--success-text)}
.level-btn.done::after{content:' ✓';font-size:11px}
.topic-btn{width:100%;text-align:left;font-size:12px;padding:5px 16px 5px 28px;border:none;background:transparent;color:var(--text3);cursor:pointer;font-family:inherit;transition:all 0.12s;border-left:3px solid transparent}
.topic-btn:hover{color:var(--text2);background:var(--bg3)}
.topic-btn.active{color:var(--info-text);background:var(--info-bg);border-left-color:var(--info-text)}
.topic-btn.done{color:var(--success-text)}
.topic-btn.done::after{content:' ✓';font-size:10px}
/* Top bar */
.topbar{display:flex;gap:8px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.topbar h2{font-size:20px;font-weight:500;flex:1}
.mode-toggle{display:flex;border:0.5px solid var(--border2);border-radius:var(--r);overflow:hidden}
.mode-toggle button{font-size:13px;padding:6px 18px;border:none;background:transparent;color:var(--text2);cursor:pointer;font-family:inherit;transition:all 0.12s}
.mode-toggle button.active{background:var(--info-bg);color:var(--info-text);font-weight:500}
/* Cards */
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:20px;margin-bottom:14px}
.card-title{font-size:12px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:14px}
/* Rules table */
.rules-table{width:100%;border-collapse:collapse;font-size:14px}
.rules-table th{text-align:left;font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;padding:0 0 8px;border-bottom:0.5px solid var(--border)}
.rules-table td{padding:7px 0;border-bottom:0.5px solid var(--border);vertical-align:top}
.rules-table tr:last-child td{border-bottom:none}
.rules-table td:first-child{font-weight:500;color:var(--text);padding-right:20px;width:45%}
.rules-table td:last-child{color:var(--text2)}
.rule-note{font-size:13px;color:var(--text2);background:var(--bg2);border-radius:var(--r);padding:12px 14px;margin-top:14px;line-height:1.7}
.rule-note strong{color:var(--text);font-weight:500}
/* Practice */
.score-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.score-pill{background:var(--bg2);border-radius:var(--r);padding:7px 14px;font-size:13px;color:var(--text2)}
.score-pill span{font-weight:500;color:var(--text)}
.prog-wrap{height:5px;background:var(--bg3);border-radius:3px;margin-bottom:16px;overflow:hidden}
.prog-fill{height:100%;background:var(--info-text);border-radius:3px;transition:width 0.3s}
.q-num{font-size:12px;color:var(--text3);margin-bottom:6px}
.q-text{font-size:16px;font-weight:500;color:var(--text);margin-bottom:16px;line-height:1.5}
input[type=text]{width:100%;font-size:14px;padding:9px 12px;border-radius:var(--r);border:0.5px solid var(--border2);background:var(--bg);color:var(--text);font-family:inherit;outline:none}
input[type=text]:focus{box-shadow:0 0 0 2px var(--info-border);border-color:transparent}
.hint-text{font-size:12px;color:var(--text3);margin-top:7px;font-style:italic;min-height:18px}
.btn-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
button{font-size:13px;padding:7px 18px;border-radius:var(--r);border:0.5px solid var(--border2);background:var(--bg);color:var(--text);cursor:pointer;font-family:inherit;transition:all 0.12s}
button:hover{background:var(--bg2)}
button:active{transform:scale(0.98)}
.btn-p{background:var(--info-bg);color:var(--info-text);border-color:var(--info-border);font-weight:500}
.btn-p:hover{background:var(--info-bg);opacity:0.9}
.btn-s{background:var(--success-bg);color:var(--success-text);border-color:var(--success-border);font-weight:500}
.feedback{margin-top:14px;padding:12px 14px;border-radius:var(--r);font-size:14px;line-height:1.6;display:none}
.feedback.ok{background:var(--success-bg);color:var(--success-text);display:block}
.feedback.bad{background:var(--danger-bg);color:var(--danger-text);display:block}
/* Evaluation */
.eval-header{text-align:center;padding:24px 0 16px}
.eval-header h3{font-size:18px;font-weight:500;margin-bottom:6px}
.eval-header p{font-size:14px;color:var(--text2)}
.big-score{font-size:48px;font-weight:500;text-align:center;margin:16px 0 4px}
.big-label{font-size:14px;color:var(--text2);text-align:center;margin-bottom:20px}
.eval-result{padding:14px 16px;border-radius:var(--r);font-size:14px;line-height:1.7;margin-bottom:14px}
.eval-pass{background:var(--success-bg);color:var(--success-text)}
.eval-fail{background:var(--warn-bg);color:var(--warn-text)}
.badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:10px;font-weight:500}
.badge-a1{background:#eaf3de;color:#3b6d11}
.badge-a2{background:#e1f5ee;color:#0f6e56}
.badge-b1{background:#faeeda;color:#854f0b}
.badge-b2{background:#faece7;color:#993c1d}
.badge-c1{background:#eeedfe;color:#3c3489}
.welcome{max-width:520px;margin:40px auto;text-align:center}
.welcome h2{font-size:22px;font-weight:500;margin-bottom:10px}
.welcome p{font-size:14px;color:var(--text2);line-height:1.8;margin-bottom:20px}
.level-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:20px}
.level-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:14px;cursor:pointer;text-align:center;transition:border-color 0.12s}
.level-card:hover{border-color:var(--info-border)}
.level-card .lc-title{font-size:18px;font-weight:500;margin-bottom:4px}
.level-card .lc-sub{font-size:12px;color:var(--text2)}
@media(max-width:600px){.shell{flex-direction:column}.sidebar{width:100%;height:auto;position:static;display:flex;flex-wrap:wrap;gap:4px;padding:12px}.main{padding:16px 12px 40px}}
</style>
</head>
<body>
<div class="shell">
  <nav class="sidebar" id="sidebar">
    <div id="sidebarContent"></div>
  </nav>
  <div class="main" id="main">
    <div id="view"></div>
  </div>
</div>

<script>
const CURRICULUM = {
  A1: {
    label: 'A1 — Beginner',
    description: 'Absolute basics: greetings, simple sentences, key verbs, numbers.',
    topics: [
      {
        id:'a1_sein', title:'Verb: sein (to be)',
        rules:[
          ['Ich bin','I am — Ich bin Ingenieur.'],
          ['Du bist','You are — Du bist neu.'],
          ['Er / Sie / Es ist','He/She/It is — Er ist müde.'],
          ['Wir sind','We are — Wir sind ein Team.'],
          ['Ihr seid','You all are — Ihr seid Entwickler.'],
          ['Sie sind','They / You (formal) are — Sie sind Experten.']
        ],
        note:'<strong>Sein</strong> is the most important German verb. Use it for identity, profession, nationality and states. It is highly irregular — memorise each form. Example: <strong>Ich bin Softwareingenieur.</strong>',
        ex:[
          {q:'Translate: "I am a software engineer."',a:['ich bin softwareingenieur','ich bin software-ingenieur','ich bin softwareentwickler'],h:'Ich + bin + profession'},
          {q:'Translate: "We are a team."',a:['wir sind ein team'],h:'Wir takes "sind"'},
          {q:'Translate: "She is new."',a:['sie ist neu'],h:'She = sie (lowercase in middle), use "ist"'},
          {q:'Fill in: "Du ___ mein Kollege."',a:['bist'],h:'Du-form of sein'},
          {q:'Translate: "They are developers."',a:['sie sind entwickler'],h:'They = sie, use "sind"'},
          {q:'Fill in: "Ich ___ müde."',a:['bin'],h:'Ich-form of sein'},
          {q:'Translate: "He is the team lead."',a:['er ist der teamleiter','er ist team lead'],h:'Er + ist'},
          {q:'Fill in: "Wir ___ Kollegen."',a:['sind'],h:'Wir-form of sein'}
        ]
      },
      {
        id:'a1_haben', title:'Verb: haben (to have)',
        rules:[
          ['Ich habe','I have'],['Du hast','You have'],['Er/Sie/Es hat','He/She/It has'],
          ['Wir haben','We have'],['Ihr habt','You all have'],['Sie haben','They/You (formal) have']
        ],
        note:'<strong>Haben</strong> is used for possession and as a helping verb for past tense. Example: <strong>Ich habe Erfahrung.</strong> Die Aufgabe hat einen Bug.',
        ex:[
          {q:'Translate: "I have experience."',a:['ich habe erfahrung'],h:'Ich + habe + noun'},
          {q:'Translate: "The task has a bug."',a:['die aufgabe hat einen bug'],h:'hat = Er/Sie/Es form; Bug is masculine → einen'},
          {q:'Translate: "We have a meeting."',a:['wir haben ein meeting','wir haben ein treffen'],h:'Wir takes "haben"'},
          {q:'Fill in: "Er ___ 15 Jahre Erfahrung."',a:['hat'],h:'Er-form of haben'},
          {q:'Translate: "Do you have time?" (informal)',a:['hast du zeit'],h:'Du-form: hast'},
          {q:'Fill in: "Ihr ___ viele Aufgaben."',a:['habt'],h:'Ihr-form of haben'},
          {q:'Translate: "She has a solution."',a:['sie hat eine lösung','sie hat eine loesung'],h:'Sie (she) + hat'},
          {q:'Fill in: "Wir ___ kein Problem."',a:['haben'],h:'Wir-form of haben'}
        ]
      },
      {
        id:'a1_articles', title:'Articles: der, die, das',
        rules:[
          ['der (masculine)','der Bug, der Code, der Fehler, der Kollege'],
          ['die (feminine)','die Aufgabe, die Lösung, die Erfahrung, die App'],
          ['das (neuter)','das Meeting, das Projekt, das Team, das Programm'],
          ['ein (masc/neut indef.)','ein Bug, ein Projekt, ein Meeting'],
          ['eine (fem. indef.)','eine Lösung, eine Aufgabe, eine App'],
          ['All plurals → die','die Bugs, die Lösungen, die Teams']
        ],
        note:'Every German noun has a grammatical gender — masculine, feminine, or neuter. There are no strict rules, so <strong>learn the article with every new word</strong>. Tech loanwords tend to be neuter: das Team, das Meeting, das Update.',
        ex:[
          {q:'Article for "Projekt" (neuter)?',a:['das'],h:'Neuter → das'},
          {q:'Article for "Lösung" (feminine)?',a:['die'],h:'Feminine → die'},
          {q:'Article for "Bug" (masculine)?',a:['der'],h:'Masculine → der'},
          {q:'Indefinite article for "Meeting" (neuter)',a:['ein meeting','ein'],h:'Neuter indefinite = ein'},
          {q:'Indefinite article for "Lösung" (feminine)',a:['eine lösung','eine'],h:'Feminine indefinite = eine'},
          {q:'Article for "Code" (masculine)?',a:['der'],h:'Masculine → der'},
          {q:'Indefinite article for "Bug" (masculine)',a:['ein bug','ein'],h:'Masculine indefinite = ein'},
          {q:'Translate: "the error" (der Fehler)',a:['der fehler'],h:'Masculine definite = der'}
        ]
      },
      {
        id:'a1_nominative', title:'Nominative case',
        rules:[
          ['Subject of sentence','The nominative is used for the subject — who does the action.'],
          ['der / ein','Masculine: Der Entwickler arbeitet. Ein Bug ist gefunden.'],
          ['die / eine','Feminine: Die Lösung funktioniert. Eine Aufgabe wartet.'],
          ['das / ein','Neuter: Das Team arbeitet. Ein Projekt läuft.'],
          ['die (plural)','Plural: Die Bugs sind kritisch.'],
          ['Pronouns','ich, du, er, sie, es, wir, ihr, sie/Sie']
        ],
        note:'The <strong>nominative case</strong> is the default form of a noun — the subject who performs the action. Articles in nominative: <strong>der / die / das / die</strong> and <strong>ein / eine / ein</strong>. This is what you learn first with every noun.',
        ex:[
          {q:'Which case is the subject of a sentence?',a:['nominativ','nominative'],h:'The subject is always nominative'},
          {q:'Fill in: "___ Code funktioniert." (masculine)',a:['der'],h:'Masculine nominative = der'},
          {q:'Fill in: "___ Lösung ist gut." (feminine)',a:['die'],h:'Feminine nominative = die'},
          {q:'Fill in: "___ Team ist super." (neuter)',a:['das'],h:'Neuter nominative = das'},
          {q:'Translate: "A bug exists."',a:['ein bug existiert','es gibt einen bug'],h:'Masculine indefinite nominative = ein'},
          {q:'Fill in: "___ Entwickler arbeitet viel." (masculine)',a:['der'],h:'Masculine nominative = der'},
          {q:'Translate: "The project is finished."',a:['das projekt ist fertig'],h:'Das Projekt — neuter nominative'},
          {q:'Fill in: "___ Aufgabe ist schwer." (feminine)',a:['die'],h:'Feminine nominative = die'}
        ]
      },
      {
        id:'a1_negation', title:'Negation: nicht & kein',
        rules:[
          ['nicht','negates verbs and adjectives — Ich verstehe nicht.'],
          ['kein (masc/neut)','negates masc/neuter nouns — kein Bug, kein Problem'],
          ['keine (fem/plural)','negates fem/plural nouns — keine Zeit, keine Fehler'],
          ['nie','never — Ich mache das nie.'],
          ['noch nicht','not yet — Es ist noch nicht fertig.'],
          ['nicht mehr','no longer — Er arbeitet nicht mehr dort.']
        ],
        note:'Use <strong>nicht</strong> to negate a verb or adjective. Use <strong>kein/keine</strong> to negate a noun — it replaces ein/eine. Example: Ich habe ein Meeting → Ich habe <strong>kein</strong> Meeting.',
        ex:[
          {q:'Negate: "Ich verstehe."',a:['ich verstehe nicht'],h:'nicht comes after the verb'},
          {q:'Negate: "Ich habe eine Lösung."',a:['ich habe keine lösung','ich habe keine loesung'],h:'eine → keine for feminine'},
          {q:'Negate: "Er hat einen Bug."',a:['er hat keinen bug'],h:'einen → keinen (masculine accusative)'},
          {q:'Translate: "I do not understand."',a:['ich verstehe nicht'],h:'Verb + nicht'},
          {q:'Translate: "We have no time."',a:['wir haben keine zeit'],h:'Zeit is feminine → keine'},
          {q:'Translate: "She never works late."',a:['sie arbeitet nie spät','sie arbeitet nie spaet'],h:'nie = never'},
          {q:'Translate: "The project is not yet finished."',a:['das projekt ist noch nicht fertig'],h:'noch nicht = not yet'},
          {q:'Negate: "Ich habe ein Meeting."',a:['ich habe kein meeting'],h:'neuter → kein'}
        ]
      },
      {
        id:'a1_questions', title:'Question words (W-Fragen)',
        rules:[
          ['Wer?','Who? — Wer ist das?'],
          ['Was?','What? — Was machst du?'],
          ['Wo?','Where? — Wo arbeitest du?'],
          ['Wohin?','Where to? — Wohin gehst du?'],
          ['Wann?','When? — Wann fängst du an?'],
          ['Warum? / Wieso?','Why? — Warum lernst du Deutsch?'],
          ['Wie?','How? — Wie geht es dir?'],
          ['Wie viel / Wie viele?','How much / How many?']
        ],
        note:'In German questions the verb comes <strong>second</strong> — right after the question word. The subject and verb swap positions. Like English: "Where DO you work?" → <strong>Wo arbeitest du?</strong>',
        ex:[
          {q:'Translate: "What do you do?" (informal)',a:['was machst du'],h:'Was + machst + du'},
          {q:'Translate: "Where do you work?" (informal)',a:['wo arbeitest du'],h:'Wo + arbeitest + du'},
          {q:'Translate: "Why are you learning German?"',a:['warum lernst du deutsch'],h:'Warum + lernst + du + Deutsch'},
          {q:'Translate: "How are you?" (informal)',a:['wie geht es dir','wie gehts',"wie geht's"],h:'Wie geht es dir?'},
          {q:'Translate: "Who is the team lead?"',a:['wer ist der teamleiter','wer ist die teamleiterin'],h:'Wer = who'},
          {q:'Translate: "How much does it cost?"',a:['wie viel kostet das','wie viel kostet es'],h:'Wie viel + kostet + das'},
          {q:'Translate: "When does the meeting start?"',a:['wann fängt das meeting an','wann faengt das meeting an','wann beginnt das meeting'],h:'Wann + verb (2nd position)'},
          {q:'Translate: "Where are you going?"',a:['wohin gehst du'],h:'Wohin = where to (direction)'}
        ]
      },
      {
        id:'a1_numbers', title:'Numbers & time',
        rules:[
          ['1–10','eins, zwei, drei, vier, fünf, sechs, sieben, acht, neun, zehn'],
          ['11–20','elf, zwölf, dreizehn, vierzehn, fünfzehn, sechzehn, siebzehn, achtzehn, neunzehn, zwanzig'],
          ['Tens','dreißig, vierzig, fünfzig, sechzig, siebzig, achtzig, neunzig, hundert'],
          ['Time','Es ist zwei Uhr. Es ist halb drei (= 2:30). Viertel nach vier (4:15).'],
          ['Days','Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag, Sonntag'],
          ['Months','Januar, Februar, März, April, Mai, Juni, Juli, August, September, Oktober, November, Dezember']
        ],
        note:'Numbers above 20 combine: <strong>einundzwanzig</strong> (21 = one-and-twenty), <strong>zweiunddreißig</strong> (32). Time: <strong>halb</strong> means "half to" the next hour — halb drei = 2:30 (half-way to three)!',
        ex:[
          {q:'How do you say "15" in German?',a:['fünfzehn','fuenfzehn'],h:'fünf + zehn'},
          {q:'How do you say "Wednesday"?',a:['mittwoch'],h:'Mitte = middle, Woche = week'},
          {q:'Translate: "It is 3 o\'clock."',a:['es ist drei uhr'],h:'Es ist + number + Uhr'},
          {q:'How do you say "30" in German?',a:['dreißig','dreissig'],h:'dreißig'},
          {q:'Translate: "Monday morning"',a:['montag morgen','montagmorgen'],h:'Montag + Morgen'},
          {q:'How do you say "half past two" (2:30)?',a:['halb drei'],h:'halb + next hour!'},
          {q:'How do you say "Friday"?',a:['freitag'],h:'Freitag'},
          {q:'How do you say "100"?',a:['hundert','einhundert'],h:'hundert'}
        ]
      }
    ]
  },
  A2: {
    label: 'A2 — Elementary',
    description: 'Cases, separable verbs, modal verbs, past tense basics.',
    topics: [
      {
        id:'a2_accusative', title:'Accusative case',
        rules:[
          ['Only masculine changes!','der → den, ein → einen, kein → keinen'],
          ['Feminine stays same','die → die, eine → eine, keine → keine'],
          ['Neuter stays same','das → das, ein → ein, kein → kein'],
          ['When to use it','Direct object of a verb: Ich sehe den Code.'],
          ['Common acc. prepositions','durch, für, gegen, ohne, um + accusative'],
          ['Pronouns acc.','mich (me), dich (you), ihn (him), sie (her), uns (us)']
        ],
        note:'The accusative is used for the <strong>direct object</strong> — what receives the action. Only masculine articles change: <strong>der→den, ein→einen</strong>. Feminine and neuter stay the same.',
        ex:[
          {q:'Fill in: "Ich habe ___ Bug gefunden." (der Bug)',a:['einen'],h:'Masculine indefinite in accusative = einen'},
          {q:'Fill in: "Wir brauchen ___ Lösung." (die Lösung)',a:['eine'],h:'Feminine stays the same'},
          {q:'Fill in: "Er schreibt ___ Code." (der Code)',a:['den'],h:'Masculine definite in accusative = den'},
          {q:'Fill in: "Ich starte ___ Programm." (das Programm)',a:['das'],h:'Neuter stays the same'},
          {q:'Translate: "I need a task." (die Aufgabe)',a:['ich brauche eine aufgabe'],h:'Feminine → eine in accusative'},
          {q:'Fill in: "Ich habe ___ Fehler gemacht." (der Fehler)',a:['einen'],h:'Masculine → einen'},
          {q:'Fill in: "Sie schreibt ___ E-Mail." (die E-Mail)',a:['eine'],h:'Feminine → eine stays'},
          {q:'Translate: "I see the team." (das Team)',a:['ich sehe das team'],h:'Neuter stays das'}
        ]
      },
      {
        id:'a2_dative', title:'Dative case',
        rules:[
          ['Masculine/Neuter: dem/einem','Ich helfe dem Kollegen. Mit einem Tool.'],
          ['Feminine: der/einer','Ich helfe der Kollegin. Mit einer App.'],

const PASS_THRESHOLD = 0.75;
const LEVEL_PASS = 0.7;

let state = {
  level: null,
  topic: null,
  mode: 'learn',
  currentQ: 0,
  correct: 0,
  total: 0,
  completed: {},
  levelScores: {}
};

function load(s){try{const d=localStorage.getItem('de_state');if(d){const p=JSON.parse(d);state.completed=p.completed||{};state.levelScores=p.levelScores||{};}}catch(e){}}
function save(){try{localStorage.setItem('de_state',JSON.stringify({completed:state.completed,levelScores:state.levelScores}));}catch(e){}}
load();

function buildSidebar(){
  let h='';
  Object.entries(CURRICULUM).forEach(([lvl,data])=>{
    const allDone=data.topics.every(t=>state.completed[t.id]);
    h+=`<div class="sidebar-title">${data.label}</div>`;
    h+=`<button class="level-btn${allDone?' done':''}" onclick="selectLevel('${lvl}')" id="lvlbtn_${lvl}">${lvl} Overview</button>`;
    data.topics.forEach(t=>{
      const done=state.completed[t.id];
      h+=`<button class="topic-btn${done?' done':''}" onclick="selectTopic('${lvl}','${t.id}')" id="tbtn_${t.id}">${t.title}</button>`;
    });
    h+=`<button class="topic-btn" style="color:var(--warn-text)" onclick="startEval('${lvl}')" id="evalbtn_${lvl}">⚑ Level test: ${lvl}</button>`;
  });
  document.getElementById('sidebarContent').innerHTML=h;
}

function updateSidebarActive(){
  document.querySelectorAll('.level-btn,.topic-btn').forEach(b=>b.classList.remove('active'));
  if(state.level && !state.topic){
    const b=document.getElementById('lvlbtn_'+state.level);
    if(b)b.classList.add('active');
  }
  if(state.topic){
    const b=document.getElementById('tbtn_'+state.topic);
    if(b)b.classList.add('active');
  }
}

function selectLevel(lvl){
  state.level=lvl;state.topic=null;state.mode='learn';
  updateSidebarActive();
  showLevelOverview(lvl);
}

function selectTopic(lvl,tid){
  state.level=lvl;state.topic=tid;state.mode='learn';
  state.currentQ=0;state.correct=0;state.total=0;
  updateSidebarActive();
  renderTopic();
}

function getTopicData(){
  const lvl=CURRICULUM[state.level];
  if(!lvl)return null;
  return lvl.topics.find(t=>t.id===state.topic);
}

function showLevelOverview(lvl){
  const data=CURRICULUM[lvl];
  const score=state.levelScores[lvl];
  let scoreHtml='';
  if(score!==undefined){
    const pct=Math.round(score*100);
    const pass=score>=LEVEL_PASS;
    scoreHtml=`<div class="eval-result ${pass?'eval-pass':'eval-fail'}">
      Last level test: <strong>${pct}%</strong> — ${pass?'Passed! You can advance to the next level.':'Not yet — keep practising and try again!'}
    </div>`;
  }
  const topicsHtml=data.topics.map(t=>{
    const done=state.completed[t.id];
    return `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:0.5px solid var(--border);font-size:14px">
      <span style="color:${done?'var(--success-text)':'var(--text3)'};font-size:16px">${done?'✓':'○'}</span>
      <span style="flex:1;color:var(--text)">${t.title}</span>
      <button class="btn-p" style="padding:4px 12px;font-size:12px" onclick="selectTopic('${lvl}','${t.id}')">Study</button>
    </div>`;
  }).join('');
  document.getElementById('view').innerHTML=`
    <div class="topbar"><h2>${data.label}</h2></div>
    <p style="color:var(--text2);font-size:14px;margin-bottom:16px">${data.description}</p>
    ${scoreHtml}
    <div class="card">
      <div class="card-title">Topics in this level</div>
      ${topicsHtml}
    </div>
    <button class="btn" style="background:var(--warn-bg);color:var(--warn-text);border-color:var(--warn-border)" onclick="startEval('${lvl}')">Take level test →</button>
  `;
}

function renderTopic(){
  const t=getTopicData();
  if(!t)return;
  const modeHtml=`<div class="mode-toggle">
    <button id="btnLearn" ${state.mode==='learn'?'class="active"':''} onclick="switchMode('learn')">Learn</button>
    <button id="btnPractice" ${state.mode==='practice'?'class="active"':''} onclick="switchMode('practice')">Practice</button>
  </div>`;
  const badge=`<span class="badge badge-${state.level.toLowerCase()}">${state.level}</span>`;
  if(state.mode==='learn'){
    const rulesHtml=t.rules.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('');
    document.getElementById('view').innerHTML=`
      <div class="topbar"><h2>${t.title} ${badge}</h2>${modeHtml}</div>
      <div class="card">
        <div class="card-title">Rules & examples</div>
        <table class="rules-table">
          <thead><tr><th>German</th><th>English / Notes</th></tr></thead>
          <tbody>${rulesHtml}</tbody>
        </table>
        <div class="rule-note">${t.note}</div>
      </div>
      <button class="btn-p" onclick="switchMode('practice')">Practice this topic →</button>
    `;
  } else {
    renderPractice(t, badge, modeHtml);
  }
}

function renderPractice(t, badge, modeHtml){
  const q=t.ex[state.currentQ%t.ex.length];
  const prog=Math.round(((state.currentQ%t.ex.length)/t.ex.length)*100);
  const acc=state.total>0?Math.round((state.correct/state.total)*100)+'%':'—';
  document.getElementById('view').innerHTML=`
    <div class="topbar"><h2>${t.title} ${badge}</h2>${modeHtml}</div>
    <div class="score-bar">
      <div class="score-pill">Correct: <span id="sc">${state.correct}</span></div>
      <div class="score-pill">Attempts: <span id="st">${state.total}</span></div>
      <div class="score-pill">Accuracy: <span id="sa">${acc}</span></div>
    </div>
    <div class="prog-wrap"><div class="prog-fill" id="pf" style="width:${prog}%"></div></div>
    <div class="card">
      <div class="q-num" id="qn">Question ${state.currentQ%t.ex.length+1} of ${t.ex.length}</div>
      <div class="q-text" id="qt">${q.q}</div>
      <input type="text" id="qi" placeholder="Type your answer in German..." autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter')checkAns()" />
      <div class="hint-text" id="qh"></div>
      <div class="btn-row">
        <button class="btn-p" onclick="checkAns()">Check ↵</button>
        <button onclick="nextQ()">Skip</button>
        <button onclick="showHint()">Hint</button>
        <button onclick="resetPractice()">Reset</button>
      </div>
      <div class="feedback" id="fb"></div>
    </div>
  `;
  document.getElementById('qi').focus();
}

function switchMode(m){
  state.mode=m;
  if(m==='practice'){state.currentQ=0;state.correct=0;state.total=0;}
  renderTopic();
}

function norm(s){
  return s.toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[.,!?;:]/g,'').replace(/\s+/g,' ').trim();
}

function checkAns(){
  const t=getTopicData();if(!t)return;
  const inp=document.getElementById('qi');if(!inp)return;
  const val=inp.value.trim();if(!val)return;
  const q=t.ex[state.currentQ%t.ex.length];
  const correct=q.a.some(a=>norm(val)===norm(a));
  state.total++;
  if(correct)state.correct++;
  const fb=document.getElementById('fb');
  if(correct){
    fb.className='feedback ok';
    fb.textContent=encourage()+' Correct!';
    setTimeout(()=>nextQ(),1400);
  } else {
    fb.className='feedback bad';
    fb.innerHTML='Not quite. Correct: <strong>'+q.a[0]+'</strong>';
    setTimeout(()=>nextQ(),2600);
  }
  updateScoreDisplay();
  if(state.correct>=Math.ceil(t.ex.length*PASS_THRESHOLD)&&state.total>=t.ex.length){
    state.completed[t.id]=true;save();buildSidebar();updateSidebarActive();
  }
}

function updateScoreDisplay(){
  const sc=document.getElementById('sc');const st=document.getElementById('st');const sa=document.getElementById('sa');
  if(sc)sc.textContent=state.correct;
  if(st)st.textContent=state.total;
  if(sa)sa.textContent=state.total>0?Math.round((state.correct/state.total)*100)+'%':'—';
}

function nextQ(){
  state.currentQ++;
  const t=getTopicData();if(!t)return;
  const q=t.ex[state.currentQ%t.ex.length];
  const prog=Math.round(((state.currentQ%t.ex.length)/t.ex.length)*100);
  const qn=document.getElementById('qn');const qt=document.getElementById('qt');
  const qi=document.getElementById('qi');const qh=document.getElementById('qh');
  const fb=document.getElementById('fb');const pf=document.getElementById('pf');
  if(qn)qn.textContent='Question '+(state.currentQ%t.ex.length+1)+' of '+t.ex.length;
  if(qt)qt.textContent=q.q;
  if(qi){qi.value='';qi.focus();}
  if(qh)qh.textContent='';
  if(fb){fb.className='feedback';fb.textContent='';}
  if(pf)pf.style.width=prog+'%';
}

function showHint(){
  const t=getTopicData();if(!t)return;
  const q=t.ex[state.currentQ%t.ex.length];
  const qh=document.getElementById('qh');
  if(qh)qh.textContent='Hint: '+q.h;
}

function resetPractice(){state.currentQ=0;state.correct=0;state.total=0;renderTopic();}

function encourage(){
  const m=['Sehr gut!','Wunderbar!','Ausgezeichnet!','Prima!','Richtig!','Toll!'];
  return m[Math.floor(Math.random()*m.length)];
}

// EVALUATION
let evalState={level:null,questions:[],current:0,correct:0,total:0};

function startEval(lvl){
  state.level=lvl;state.topic=null;
  updateSidebarActive();
  const data=CURRICULUM[lvl];
  // Pick 3 questions per topic randomly
  let qs=[];
  data.topics.forEach(t=>{
    const shuffled=[...t.ex].sort(()=>Math.random()-0.5);
    shuffled.slice(0,3).forEach(q=>qs.push({...q,topicTitle:t.title}));
  });
  qs=qs.sort(()=>Math.random()-0.5);
  evalState={level:lvl,questions:qs,current:0,correct:0,total:0};
  renderEvalQ();
}

function renderEvalQ(){
  const {questions,current,correct,total,level}=evalState;
  if(current>=questions.length){showEvalResult();return;}
  const q=questions[current];
  const prog=Math.round((current/questions.length)*100);
  document.getElementById('view').innerHTML=`
    <div class="topbar"><h2>Level Test: ${level}</h2></div>
    <div class="score-bar">
      <div class="score-pill">Question: <span>${current+1} / ${questions.length}</span></div>
      <div class="score-pill">Correct: <span id="esc">${correct}</span></div>
    </div>
    <div class="prog-wrap"><div class="prog-fill" style="width:${prog}%"></div></div>
    <div class="card">
      <div class="q-num" style="margin-bottom:4px">Topic: ${q.topicTitle}</div>
      <div class="q-text">${q.q}</div>
      <input type="text" id="eqi" placeholder="Type your answer..." autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter')checkEval()" />
      <div class="hint-text" id="eqh"></div>
      <div class="btn-row">
        <button class="btn-p" onclick="checkEval()">Check ↵</button>
        <button onclick="skipEval()">Skip</button>
        <button onclick="document.getElementById('eqh').textContent='Hint: '+evalState.questions[evalState.current].h">Hint</button>
      </div>
      <div class="feedback" id="efb"></div>
    </div>
  `;
  document.getElementById('eqi').focus();
}

function checkEval(){
  const qi=document.getElementById('eqi');if(!qi)return;
  const val=qi.value.trim();if(!val)return;
  const q=evalState.questions[evalState.current];
  const correct=q.a.some(a=>norm(val)===norm(a));
  evalState.total++;
  if(correct)evalState.correct++;
  const fb=document.getElementById('efb');
  if(correct){
    fb.className='feedback ok';fb.textContent=encourage()+' Correct!';
    setTimeout(()=>{evalState.current++;renderEvalQ();},1200);
  } else {
    fb.className='feedback bad';fb.innerHTML='Not quite. Correct: <strong>'+q.a[0]+'</strong>';
    setTimeout(()=>{evalState.current++;renderEvalQ();},2400);
  }
}

function skipEval(){evalState.current++;renderEvalQ();}

function showEvalResult(){
  const {correct,questions,level}=evalState;
  const total=questions.length;
  const pct=Math.round((correct/total)*100);
  const pass=correct/total>=LEVEL_PASS;
  state.levelScores[level]=correct/total;save();
  const levels=Object.keys(CURRICULUM);
  const nextIdx=levels.indexOf(level)+1;
  const nextLevel=nextIdx<levels.length?levels[nextIdx]:null;
  let nextHtml='';
  if(pass&&nextLevel){
    nextHtml=`<button class="btn-s" style="margin-top:10px" onclick="selectLevel('${nextLevel}')">Go to ${nextLevel} →</button>`;
  }
  document.getElementById('view').innerHTML=`
    <div class="eval-header">
      <h3>Level Test Complete: ${level}</h3>
      <p>${CURRICULUM[level].label}</p>
    </div>
    <div class="big-score" style="color:${pass?'var(--success-text)':'var(--warn-text)'}">${pct}%</div>
    <div class="big-label">${correct} / ${total} correct</div>
    <div class="eval-result ${pass?'eval-pass':'eval-fail'}">
      ${pass
        ? `Herzlichen Glückwunsch! 🎉 You passed ${level}! You have a solid grasp of this level's grammar.${nextLevel?' You are ready to advance to '+nextLevel+'!':' You have completed the full curriculum!'}`
        : `Keep practising! You need ${Math.ceil(total*LEVEL_PASS)} correct answers (${Math.round(LEVEL_PASS*100)}%) to pass. Review the topics and try again.`
      }
    </div>
    <div class="btn-row">
      <button onclick="selectLevel('${level}')">Review ${level} topics</button>
      <button onclick="startEval('${level}')">Retry test</button>
      ${nextHtml}
    </div>
  `;
  buildSidebar();
}

// Welcome screen
function showWelcome(){
  const levelCards=Object.entries(CURRICULUM).map(([lvl,data])=>{
    const score=state.levelScores[lvl];
    const pct=score!==undefined?Math.round(score*100)+'%':'—';
    const allDone=data.topics.every(t=>state.completed[t.id]);
    return `<div class="level-card" onclick="selectLevel('${lvl}')">
      <div class="lc-title"><span class="badge badge-${lvl.toLowerCase()}">${lvl}</span></div>
      <div class="lc-sub" style="margin-top:6px">${data.description.split(':')[1]||data.description}</div>
      ${score!==undefined?`<div style="font-size:12px;margin-top:8px;color:${score>=LEVEL_PASS?'var(--success-text)':'var(--warn-text)'}">Test: ${pct} ${score>=LEVEL_PASS?'✓':''}</div>`:''}
      ${allDone?'<div style="font-size:12px;margin-top:4px;color:var(--success-text)">All topics done ✓</div>':''}
    </div>`;
  }).join('');
  document.getElementById('view').innerHTML=`
    <div class="welcome">
      <h2>🇩🇪 German Grammar Curriculum</h2>
      <p>A complete A1 → C1 curriculum. Study each topic, practise with exercises, and take the level test to unlock the next level. Topics marked ✓ are completed.</p>
    </div>
    <div class="level-cards">${levelCards}</div>
    <p style="font-size:13px;color:var(--text3);margin-top:16px;text-align:center">Select any level or topic from the sidebar to begin.</p>
  `;
}

buildSidebar();
showWelcome();
</script>
</body>
</html>
